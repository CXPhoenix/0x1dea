<svg xmlns="http://www.w3.org/2000/svg" width="400" height="496" viewBox="0 0 400 496" role="img" aria-labelledby="title desc"><title id="title">教學模擬：凌晨電鍋加熱使家戶總功率上升</title><desc id="desc">00:00 至 02:00，每五分鐘一筆。假設基載150瓦，電鍋於01:10至01:25使用600瓦，01:25至01:35保溫50瓦，其他時間關閉。家戶總功率為兩者相加。電鍋線假設來自智慧插座的獨立量測。所有數字虛構，曲線不能辨識使用者或食物。</desc><rect width="400" height="496" fill="#fff"/><style>text{font-family:Arial,"PingFang TC","Noto Sans TC",sans-serif;font-size:18px;fill:#171717}.title{font-size:22px;font-weight:600}.muted{fill:#404040}.focal{fill:#1F6F5F;font-weight:600}</style>
