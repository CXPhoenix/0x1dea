<svg xmlns="http://www.w3.org/2000/svg" width="400" height="884" viewBox="0 0 400 884" role="img" aria-labelledby="title desc">
<title id="title">電表特徵直接估計在家狀態，紀錄另用於訓練與評估</title><desc id="desc">電流電壓相位差取每小時平均，送入已訓練模型，估計在家狀態。另行取得的在家紀錄取每小時最常出現的狀態，用於研究訓練與評估，不是每次預測的電表輸入。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#1F6F5F"/></marker></defs>
<rect width="400" height="884" fill="#FFFFFF"/>
<style>text{font-family:Arial,"PingFang TC","Noto Sans TC",sans-serif;fill:#171717;font-size:20px}.title{font-size:23px;font-weight:600}.sub{font-size:18px;fill:#404040}.focus{fill:#1F6F5F;font-weight:600}.box{fill:#FFFFFF;stroke:#D8D8D4;stroke-width:1.5}.accent{fill:#DDE9E5;stroke:#1F6F5F;stroke-width:1.5}.arrow{stroke:#1F6F5F;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="20" y="37" text-anchor="start" class="title">電表特徵 → 在家狀態估計</text><text x="20" y="65" text-anchor="start" class="sub">不必先做 NILM 設備辨識</text><rect class="box" x="20" y="92" width="360" height="58" rx="4"/><text x="200" y="128" text-anchor="middle" class="">電流・電壓・相位差</text><line class="arrow" x1="200" y1="162" x2="200" y2="184"/><rect class="box" x="20" y="200" width="360" height="58" rx="4"/><text x="200" y="236" text-anchor="middle" class="">每小時取平均</text><line class="arrow" x1="200" y1="270" x2="200" y2="292"/><rect class="box" x="20" y="308" width="360" height="58" rx="4"/><text x="200" y="344" text-anchor="middle" class="">訓練好的在家狀態模型</text><line class="arrow" x1="200" y1="378" x2="200" y2="400"/><rect class="accent" x="20" y="416" width="360" height="76" rx="4"/><text x="200" y="447" text-anchor="middle" class="focus">在家／不在家估計</text><text x="200" y="474" text-anchor="middle" class="sub">估計是否有人在家</text><line x1="20" y1="526" x2="380" y2="526" stroke="#D8D8D4"/><text x="20" y="563" text-anchor="start" class="title">訓練與評估：比對在家紀錄</text><rect class="box" x="20" y="591" width="360" height="76" rx="4"/><text x="200" y="622" text-anchor="middle" class="">另行取得的在家狀態紀錄</text><text x="200" y="649" text-anchor="middle" class="sub">來自住戶回報／感測器</text><line class="arrow" x1="200" y1="679" x2="200" y2="701"/><rect class="box" x="20" y="717" width="360" height="76" rx="4"/><text x="200" y="748" text-anchor="middle" class="">取每小時最常出現的狀態</text><text x="200" y="775" text-anchor="middle" class="sub">用於訓練模型、核對估計</text><text x="200" y="832" text-anchor="middle" class="sub">紀錄不屬於每次預測的電表輸入</text><text x="200" y="860" text-anchor="middle" class="sub">在家狀態估計流程示意</text>
</svg>