<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="title desc">
<title id="title">由整戶用電估計設備用電，再與單獨量測比較</title><desc id="desc">整戶功率量測流入能源分解模型，輸出個別設備用電估計。研究另取得各設備單獨量測的用電，比較估計差異。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#1F6F5F"/></marker></defs>
<rect width="400" height="620" fill="#FFFFFF"/>
<style>text{font-family:Arial,"PingFang TC","Noto Sans TC",sans-serif;fill:#171717;font-size:20px}.title{font-size:23px;font-weight:600}.sub{font-size:18px;fill:#404040}.focus{fill:#1F6F5F;font-weight:600}.box{fill:#FFFFFF;stroke:#D8D8D4;stroke-width:1.5}.accent{fill:#DDE9E5;stroke:#1F6F5F;stroke-width:1.5}.arrow{stroke:#1F6F5F;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="20" y="37" text-anchor="start" class="title">整戶用電 → 個別設備估計</text><text x="20" y="65" text-anchor="start" class="sub">NILM 的輸出仍是估計</text><rect class="box" x="20" y="92" width="360" height="76" rx="4"/><text x="200" y="123" text-anchor="middle" class="">整戶功率量測</text><text x="200" y="150" text-anchor="middle" class="sub">隨時間記錄整戶的總訊號</text><line class="arrow" x1="200" y1="180" x2="200" y2="202"/><rect class="box" x="20" y="218" width="360" height="58" rx="4"/><text x="200" y="254" text-anchor="middle" class="">能源分解模型</text><line class="arrow" x1="200" y1="288" x2="200" y2="310"/><rect class="accent" x="20" y="326" width="360" height="76" rx="4"/><text x="200" y="357" text-anchor="middle" class="focus">個別設備用電估計</text><text x="200" y="384" text-anchor="middle" class="sub">由混合訊號推估設備用電</text><line class="arrow" x1="200" y1="414" x2="200" y2="444"/><rect class="box" x="20" y="462" width="360" height="100" rx="4"/><text x="200" y="491" text-anchor="middle" class="">評估：比較各設備單獨量測的用電</text><text x="200" y="520" text-anchor="middle" class="sub">各設備的用電另外量測</text><text x="200" y="545" text-anchor="middle" class="sub">看估計與量測差多少</text><text x="200" y="598" text-anchor="middle" class="sub">能源分解與評估流程示意</text>
</svg>